<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Positive: listbox opened via hidden attribute only</title>
    <style>
      body { font: 14px -apple-system, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
      .listbox { list-style: none; margin: 8px 0 0; padding: 4px 0; border: 1px solid #d4d4d8; border-radius: 6px; }
      .option { padding: 6px 10px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Open via <code>hidden</code> only (no aria-expanded)</h1>
    <p>Click the button. Expected: United States moves to the top after the listbox becomes visible.</p>
    <button type="button" id="open-btn">Open country list</button>
    <ul id="hidden-listbox" role="listbox" aria-label="Country" class="listbox" hidden>
      <li role="option" data-value="AR">Argentina</li>
      <li role="option" data-value="AU">Australia</li>
      <li role="option" data-value="BR">Brazil</li>
      <li role="option" data-value="CA">Canada</li>
      <li role="option" data-value="DE">Germany</li>
      <li role="option" data-value="FR">France</li>
      <li role="option" data-value="GB">United Kingdom</li>
      <li role="option" data-value="JP">Japan</li>
      <li role="option" data-value="MX">Mexico</li>
      <li role="option" data-value="US">United States</li>
      <li role="option" data-value="UY">Uruguay</li>
    </ul>
    <script>
      document.getElementById("open-btn").addEventListener("click", () => {
        document.getElementById("hidden-listbox").hidden = false;
      });
    </script>
  </body>
</html>
