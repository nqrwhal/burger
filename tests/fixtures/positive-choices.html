<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Positive: Choices.js (country)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js@10.2.0/public/assets/styles/choices.min.css">
    <style>
      body { font: 14px -apple-system, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
      label { display: block; margin-bottom: 6px; font-weight: 500; }
      .choices { width: 320px; }
    </style>
  </head>
  <body>
    <h1>Choices.js — country</h1>
    <p>Expected: backing &lt;select&gt; is reordered immediately; when you open the dropdown the visible list (role=listbox) also shows United States at the top, courtesy of the ARIA adapter.</p>

    <label for="country">Country</label>
    <select id="country" name="country" autocomplete="country">
      <option value="">Select country</option>
      <option value="AR">Argentina</option>
      <option value="AU">Australia</option>
      <option value="BR">Brazil</option>
      <option value="CA">Canada</option>
      <option value="CN">China</option>
      <option value="DE">Germany</option>
      <option value="FR">France</option>
      <option value="GB">United Kingdom</option>
      <option value="IN">India</option>
      <option value="IT">Italy</option>
      <option value="JP">Japan</option>
      <option value="MX">Mexico</option>
      <option value="NL">Netherlands</option>
      <option value="ES">Spain</option>
      <option value="SE">Sweden</option>
      <option value="US">United States</option>
      <option value="UY">Uruguay</option>
    </select>

    <script src="https://cdn.jsdelivr.net/npm/choices.js@10.2.0/public/assets/scripts/choices.min.js"></script>
    <script>
      new Choices('#country', { placeholder: true, placeholderValue: 'Select country' });
    </script>
  </body>
</html>
