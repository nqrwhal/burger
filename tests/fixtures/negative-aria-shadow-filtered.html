<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Negative: filtered combobox inside shadow DOM</title>
    <style>
      body { font: 14px -apple-system, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
      .listbox { list-style: none; margin: 8px 0 0; padding: 4px 0; border: 1px solid #d4d4d8; border-radius: 6px; }
      .option { padding: 6px 10px; }
    </style>
  </head>
  <body>
    <h1>Filtered combobox in open shadow root — must NOT reorder</h1>
    <p>The combobox lives in a shadow root; the listbox is in light DOM. Filter text is non-empty.</p>
    <div id="host"></div>
    <ul id="flist-shadow" role="listbox" aria-label="Country" class="listbox">
      <li role="option" data-value="DE">Germany</li>
      <li role="option" data-value="FR">France</li>
      <li role="option" data-value="US">United States</li>
    </ul>
    <script>
      const host = document.getElementById("host");
      const root = host.attachShadow({ mode: "open" });
      root.innerHTML = `
        <input
          id="shadow-combo"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="flist-shadow"
          aria-expanded="true"
          aria-label="Country"
          value="Ger"
        />
      `;
    </script>
  </body>
</html>
