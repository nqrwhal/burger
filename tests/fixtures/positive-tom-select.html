<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Positive: Tom Select (currency)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css">
    <style>
      body { font: 14px -apple-system, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
      label { display: block; margin-bottom: 6px; font-weight: 500; }
      .ts-wrapper { width: 320px; }
    </style>
  </head>
  <body>
    <h1>Tom Select — currency</h1>
    <p>Expected: backing &lt;select&gt; reordered; opening the dropdown shows USD on top via the ARIA adapter.</p>

    <label for="currency">Currency</label>
    <select id="currency" name="currency">
      <option value="">Select currency</option>
      <option value="EUR">EUR — Euro</option>
      <option value="GBP">GBP — British Pound</option>
      <option value="JPY">JPY — Japanese Yen</option>
      <option value="CAD">CAD — Canadian Dollar</option>
      <option value="AUD">AUD — Australian Dollar</option>
      <option value="CHF">CHF — Swiss Franc</option>
      <option value="USD">USD — US Dollar</option>
      <option value="SEK">SEK — Swedish Krona</option>
    </select>

    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    <script>
      new TomSelect('#currency', { create: false });
    </script>
  </body>
</html>
