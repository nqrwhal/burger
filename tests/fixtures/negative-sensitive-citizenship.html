<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Negative: country of citizenship</title></head>
  <body>
    <h1>Country of citizenship — sensitive, must NOT be modified by default</h1>
    <p>Even though this is a real country list, it has legal meaning. Default mode skips it.</p>
    <form>
      <label for="citizenship">Country of citizenship</label>
      <select id="citizenship" name="citizenship">
        <option value="">Select country</option>
        <option value="CA">Canada</option>
        <option value="DE">Germany</option>
        <option value="FR">France</option>
        <option value="GB">United Kingdom</option>
        <option value="IN">India</option>
        <option value="JP">Japan</option>
        <option value="MX">Mexico</option>
        <option value="US">United States</option>
      </select>
    </form>
  </body>
</html>
